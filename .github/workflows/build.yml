name: build
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
jobs:
  windows-exe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install ziglang
      - run: ./build.sh
      - name: Checksum
        run: sha256sum plugin/bin/ClaudePet.exe | tee ClaudePet.exe.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: ClaudePet
          path: |
            plugin/bin/ClaudePet.exe
            ClaudePet.exe.sha256
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            plugin/bin/ClaudePet.exe
            ClaudePet.exe.sha256
